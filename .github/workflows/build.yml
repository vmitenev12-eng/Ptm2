name: Build patched PTM2

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1.1'

      - name: Download original jar (release "base")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p base
          gh release download base --pattern '*.jar' --dir base
          mv base/*.jar base/ptm2-base.jar
          ls -l base

      - name: Prepare Gradle project
        run: |
          mkdir -p src/main/java/com/rinventor/ptm2/fixes
          cp PtmFixes.java src/main/java/com/rinventor/ptm2/fixes/PtmFixes.java
          cat > settings.gradle <<'EOT'
          pluginManagement {
              repositories {
                  gradlePluginPortal()
                  maven { url = 'https://maven.minecraftforge.net/' }
              }
          }
          rootProject.name = 'ptmfixes'
          EOT
          cat > build.gradle <<'EOT'
          plugins {
              id 'java'
              id 'net.minecraftforge.gradle' version '[6.0,6.2)'
          }
          group = 'ptmfixes'
          version = '1'
          java.toolchain.languageVersion = JavaLanguageVersion.of(17)
          minecraft {
              mappings channel: 'official', version: '1.20.1'
          }
          repositories {
              maven { url = 'https://maven.minecraftforge.net/' }
          }
          dependencies {
              minecraft 'net.minecraftforge:forge:1.20.1-47.4.0'
              compileOnly files('base/ptm2-base.jar')
          }
          tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
          jar { archiveFileName = 'fixes.jar' }
          jar.finalizedBy('reobfJar')
          EOT

      - name: Compile fixes
        run: gradle build --no-daemon --stacktrace

      - name: Patch the jar
        run: |
          mkdir -p tools out
          for j in asm asm-tree; do
            curl -fsSL -o tools/$j.jar https://repo1.maven.org/maven2/org/ow2/asm/$j/9.6/$j-9.6.jar
          done
          javac -cp tools/asm.jar:tools/asm-tree.jar -d tools Patcher.java
          java -cp tools:tools/asm.jar:tools/asm-tree.jar Patcher base/ptm2-base.jar build/libs/fixes.jar out/ptm2-patched.jar
          ls -l out

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" out/ptm2-patched.jar \
            --title "Build ${{ github.run_number }}" \
            --notes "Patched PTM2 build ${{ github.run_number }}"
